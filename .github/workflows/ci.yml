name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Guard public copy
        run: |
          if grep -R -n -E '\[VERIFY\]|TODO\(' dist --exclude='*.map'; then
            echo "Internal markers leaked into the production build."
            exit 1
          fi
